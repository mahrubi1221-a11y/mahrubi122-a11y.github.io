<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Monster Battle</title>
<style>
:root{--bg:#f1ecf8;--ink:#2a1d3d;--panel:#ffffff;--line:#d8cceb;--btn:#5b3fa8;--btn-ink:#ffffff;--btn-off:#b9aed0;--gold:#c98a00;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#150e24;--ink:#efe8fb;--panel:#221838;--line:#3d2d63;--btn:#8a6bf0;--btn-ink:#120a22;--btn-off:#4a3b70;--gold:#f2bf3c;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#150e24;--ink:#efe8fb;--panel:#221838;--line:#3d2d63;--btn:#8a6bf0;--btn-ink:#120a22;--btn-off:#4a3b70;--gold:#f2bf3c;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Georgia,"Palatino Linotype",serif;min-height:100vh;display:flex;justify-content:center;padding:16px}
.wrap{width:100%;max-width:560px}
h1{font-size:1.7rem;margin:4px 0 2px;letter-spacing:.5px}
.sub{margin:0 0 14px;opacity:.75;font-size:.95rem}
.top{display:flex;justify-content:space-between;font-size:1rem;margin-bottom:8px}
.top b{color:var(--gold)}
.arena{position:relative;height:300px;border-radius:14px;overflow:hidden;color:#fff;background:linear-gradient(#2b1d52 0%,#4a2f7a 55%,#2a1b3f 55%,#150e24 100%);border:2px solid var(--line)}
.moon{position:absolute;top:18px;left:50%;width:46px;height:46px;border-radius:50%;background:#fff3c4;box-shadow:0 0 30px #fff3c488;transform:translateX(-50%)}
.side{position:absolute;bottom:36px;width:42%;text-align:center}
#heroBox{left:4%}#foeBox{right:4%}
.who{font-size:.9rem;margin-bottom:4px}
.bar{height:12px;border-radius:7px;background:#0007;overflow:hidden;border:1px solid #fff4}
.bar i{display:block;height:100%;width:100%;transition:width .5s}
#heroHp{background:#43c06b}#foeHp{background:#e5484d}
.num{font-size:.75rem;opacity:.85;margin:2px 0 6px}
.fighter{position:relative;font-size:76px;line-height:1.1;display:inline-block}
.fighter .pop{position:absolute;left:50%;top:0;font-size:26px;font-weight:bold;pointer-events:none;animation:rise .9s forwards;text-shadow:0 2px 4px #000}
.pop.dmg{color:#ff6b6b}.pop.heal{color:#6bff95}.pop.miss{color:#ddd;font-size:20px}
@keyframes rise{from{transform:translate(-50%,0);opacity:1}to{transform:translate(-50%,-60px);opacity:0}}
@keyframes lungeR{50%{transform:translateX(70px)}}
@keyframes lungeL{50%{transform:translateX(-70px)}}
@keyframes shake{20%{transform:translateX(-10px)}40%{transform:translateX(10px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
@keyframes die{to{opacity:0;transform:translateY(30px) rotate(20deg)}}
.lungeR{animation:lungeR .4s}.lungeL{animation:lungeL .4s}.shake{animation:shake .4s}.dead{animation:die .8s forwards}
.log{margin:12px 0;padding:10px 12px;min-height:118px;background:var(--panel);border:1px solid var(--line);border-radius:10px;font-size:.95rem}
.log p{margin:3px 0}.log p:first-child{font-weight:bold}.log p:not(:first-child){opacity:.65}
.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
button{font:inherit;font-size:1rem;padding:12px 6px;border:0;border-radius:10px;background:var(--btn);color:var(--btn-ink);cursor:pointer;line-height:1.25}
button small{display:block;opacity:.85;font-size:.78rem}
button:disabled{background:var(--btn-off);cursor:not-allowed}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.end{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:#150e24ee;text-align:center;padding:20px}
.end[hidden]{display:none}
.end h2{margin:0;font-size:1.8rem}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <h1>Monster Battle</h1>
  <p class="sub">Beat the Goblin, the Orc and the Dragon.</p>
  <div class="top"><span>Fight <b id="stage">1/3</b></span><span>Gold <b id="gold">0</b></span></div>

  <div class="arena">
    <div class="moon"></div>
    <div class="side" id="heroBox">
      <div class="who">Hero</div>
      <div class="bar"><i id="heroHp"></i></div>
      <div class="num" id="heroT"></div>
      <div class="fighter" id="hero">🧙‍♂️</div>
    </div>
    <div class="side" id="foeBox">
      <div class="who" id="foeN"></div>
      <div class="bar"><i id="foeHp"></i></div>
      <div class="num" id="foeT"></div>
      <div class="fighter" id="foe"></div>
    </div>
    <div class="end" id="end" hidden>
      <h2 id="endT"></h2>
      <div id="endS"></div>
      <button id="again" style="padding:12px 24px">Play again</button>
    </div>
  </div>

  <div class="log" id="log" aria-live="polite"></div>

  <div class="actions">
    <button id="bAtk">Attack<small>10 to 20 damage</small></button>
    <button id="bSp">Special<small id="spN"></small></button>
    <button id="bPot">Potion<small id="potN"></small></button>
  </div>
</div>

<script>
const MON=[
  {n:"Goblin",e:"👺",hp:40,hit:10,gold:20},
  {n:"Orc",e:"👹",hp:70,hit:15,gold:40},
  {n:"Dragon",e:"🐉",hp:110,hit:22,gold:100}
];
let hero,mon,idx,busy;
const $=id=>document.getElementById(id);
const rnd=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;

function say(t){
  const p=document.createElement("p");p.textContent=t;
  const l=$("log");l.prepend(p);
  while(l.children.length>5)l.lastChild.remove();
}
function pop(id,txt,cls){
  const s=document.createElement("span");
  s.className="pop "+cls;s.textContent=txt;
  $(id).appendChild(s);setTimeout(()=>s.remove(),900);
}
function anim(id,c){
  const el=$(id);el.classList.remove("lungeR","lungeL","shake","dead");
  void el.offsetWidth;el.classList.add(c);
}
function draw(){
  const h=Math.max(hero.hp,0),f=Math.max(mon.cur,0);
  $("heroHp").style.width=h+"%";
  $("heroT").textContent=h+" / 100 HP";
  $("foeHp").style.width=(f/mon.max*100)+"%";
  $("foeT").textContent=f+" / "+mon.max+" HP";
  $("gold").textContent=hero.gold;
  $("stage").textContent=(idx+1)+"/3";
  $("spN").textContent=hero.sp+" left, 70% hit";
  $("potN").textContent=hero.pot+" left, +30 HP";
  $("bAtk").disabled=busy;
  $("bSp").disabled=busy||hero.sp<1;
  $("bPot").disabled=busy||hero.pot<1;
}
function start(){
  hero={hp:100,pot:3,sp:2,gold:0};idx=0;
  $("end").hidden=true;$("log").innerHTML="";
  spawn();
}
function spawn(){
  mon={...MON[idx],max:MON[idx].hp,cur:MON[idx].hp};
  $("foe").textContent=mon.e;$("foe").className="fighter";
  $("foeN").textContent=mon.n;
  say("A wild "+mon.n+" appears!");
  busy=false;draw();
}
function hit(d,msg){
  anim("hero","lungeR");mon.cur-=d;
  setTimeout(()=>anim("foe","shake"),150);
  pop("foe","-"+d,"dmg");say(msg);
}
function act(t){
  if(busy)return;busy=true;
  if(t==="atk"){const d=rnd(10,20);hit(d,"You hit the "+mon.n+" for "+d+".");}
  else if(t==="sp"){
    hero.sp--;
    if(Math.random()<0.7){const d=rnd(30,40);hit(d,"Special attack! "+d+" damage.");}
    else{anim("hero","lungeR");pop("foe","Miss","miss");say("Your special attack missed.");}
  }else{
    hero.pot--;hero.hp=Math.min(100,hero.hp+30);
    pop("hero","+30","heal");say("You drink a potion. HP is now "+hero.hp+".");
  }
  draw();
  if(mon.cur<=0)return win();
  setTimeout(foeTurn,800);
}
function foeTurn(){
  const d=rnd(1,mon.hit);
  anim("foe","lungeL");hero.hp-=d;
  setTimeout(()=>anim("hero","shake"),150);
  pop("hero","-"+d,"dmg");say("The "+mon.n+" hits you for "+d+".");
  draw();
  if(hero.hp<=0)return finish(false);
  busy=false;draw();
}
function win(){
  hero.gold+=mon.gold;anim("foe","dead");
  say("You defeated the "+mon.n+". +"+mon.gold+" gold.");
  draw();idx++;
  if(idx>=3)setTimeout(()=>finish(true),1000);
  else setTimeout(spawn,1300);
}
function finish(won){
  busy=true;
  $("endT").textContent=won?"Victory!":"Game over";
  $("endS").textContent=(won?"All monsters defeated. ":"The "+mon.n+" got you. ")+"Gold collected: "+hero.gold;
  $("end").hidden=false;
}
$("bAtk").onclick=()=>act("atk");
$("bSp").onclick=()=>act("sp");
$("bPot").onclick=()=>act("pot");
$("again").onclick=start;
start();
</script>
</body>
</html>
